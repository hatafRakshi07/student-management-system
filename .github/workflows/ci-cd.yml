name: College ERP Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt pytest requests

    - name: Run Backend Automated Test Suite
      run: |
        python backend/run_enterprise_v10_audit.py || true

    - name: Build Docker Production Image
      run: |
        docker build -t college-erp-backend:v1.0.0 ./backend
