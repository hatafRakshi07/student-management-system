version: "3.8"

services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-CHANGE_THIS_TO_A_STRONG_RANDOM_SECRET}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./student_management.db}
      - DEBUG=false
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FRONTEND_URL=http://localhost
    volumes:
      - backend_uploads:/app/uploads
      - backend_db:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_uploads:
  backend_db:
