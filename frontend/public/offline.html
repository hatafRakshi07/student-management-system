<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offline – Aklank College</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.12);
      margin-bottom: 24px;
    }
    h1 { font-size: 1.5rem; font-weight: 800; margin: 0 0 8px; }
    p  { font-size: 0.9rem; color: #64748b; margin: 0 0 28px; max-width: 280px; }
    button {
      background: #bf2a4d;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }
    button:active { background: #9e1e40; transform: scale(.97); }
    .icon { font-size: 3rem; margin-bottom: 16px; }
  </style>
</head>
<body>
  <img src="/logo.png" alt="Aklank College" class="logo" />
  <div class="icon">📡</div>
  <h1>You're Offline</h1>
  <p>No internet connection. Please check your network and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
